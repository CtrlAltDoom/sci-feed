name: Veille quotidienne

on:
  schedule:
    - cron: "23 4 * * *"     # chaque jour vers 5 h 23 (heure de Paris en hiver)
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main
  push:
    branches: [main]
    paths: ["config.yaml", "web/**", "veille/**", ".github/workflows/veille.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecte, fiches IA et site
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}          # alertes de santé (source en panne, IA muette…)
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m veille site          # simple changement de config/apparence : pas de collecte
          else
            python -m veille tout
          fi

      - name: Sauvegarder la base d'articles
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Veille du $(date -u +%Y-%m-%d)"
          git pull --rebase           # quelqu'un (ou les notifications) a pu pousser entre-temps
          git push

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v5
        continue-on-error: true     # GitHub ne voit parfois pas encore l'artefact : on retente
      - if: steps.deploiement.outcome == 'failure'
        run: sleep 30
      - if: steps.deploiement.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Prévenir en cas d'échec
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$NTFY_TOPIC" ] && exit 0
          curl -sS -X POST https://ntfy.sh -H "Content-Type: application/json" -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"⚠️ SciFeed : la veille quotidienne a échoué\",\"message\":\"La page n'a peut-être pas été mise à jour. Touchez pour voir le détail sur GitHub.\",\"priority\":4,\"tags\":[\"warning\"],\"click\":\"$LIEN\"}"
