name: Veille quotidienne

on:
  schedule:
    # Collecte la nuit : un créneau toutes les heures de 0 h 23 à 10 h 23 UTC, soit à Paris
    # 1 h 23 → 11 h 23 en hiver, 2 h 23 → 12 h 23 en été. GitHub part parfois avec des heures de
    # retard, voire saute des créneaux. Le premier qui tourne fait la collecte (comptée pour le jour
    # de Paris) ; les suivants voient qu'elle est faite et s'arrêtent en quelques secondes.
    - cron: "23 0-10 * * *"
    # Le soir (20 h 17 à Paris en hiver, 21 h 17 en été) : rattrapage des fiches IA, sans collecte,
    # seulement s'il reste des articles sans fiche (ia.rattrapage.auto dans config.yaml).
    # Un run du soir que GitHub ferait partir après minuit UTC ne fait rien (créneaux de la nuit).
    - cron: "17 19 * * *"
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main
    inputs:
      si_pas_fait:
        description: "Ne rien faire si la collecte du jour est déjà faite (réveil externe)"
        type: boolean
        default: false
      rattrapage:
        description: "Rattrapage des fiches IA : seulement les fiches (environ 40 min), sans collecte"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["config.yaml", "requirements.txt", "web/**", "veille/**", "tests/**", ".github/workflows/veille.yml", ".github/pousser-data.sh"]

# nom du run du soir : notifications.yml le reconnaît et ne s'enchaîne pas derrière
# (vide = nom habituel : titre du commit, ou nom du workflow)
run-name: ${{ github.event.schedule == '17 19 * * *' && 'Rattrapage automatique des fiches IA' || '' }}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.rattrapage || github.event.schedule == '17 19 * * *') && 85 || 65 }}   # dont 15 min au plus pour l'audio
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Créneaux de rattrapage (et réveil externe) : si la collecte du jour est déjà faite, on s'arrête là.
      # Le rattrapage des fiches IA ne fait pas de collecte : il n'est jamais bloqué par cette garde.
      - name: Collecte du jour déjà faite ?
        id: garde
        if: (github.event_name == 'schedule' && github.event.schedule != '17 19 * * *') || (inputs.si_pas_fait == true && inputs.rattrapage != true)
        run: |
          python -m veille deja_collecte >> "$GITHUB_OUTPUT"
          tail -n 1 "$GITHUB_OUTPUT"

      # Créneau du soir : rattrapage des fiches IA seulement s'il en reste (reste=0 : tout est sauté).
      # Run du soir parti très en retard (entre 0 h et 12 h UTC) : rien, pour ne jamais occuper la
      # file « veille » pendant les créneaux de collecte de la nuit et du matin.
      # Les étapes suivantes testent « rien != 'oui' » (comme la garde : une sortie absente, autres
      # déclenchements, vaut null, et null != '0' serait faux pour GitHub, d'où ce oui/non).
      - name: Reste-t-il des fiches IA à rattraper ?
        id: reste
        if: github.event.schedule == '17 19 * * *'
        run: |
          heure=$(date -u +%H)
          if [ "$((10#$heure))" -lt 12 ]; then
            echo "Run du soir parti à ${heure} h UTC : trop tard, place à la collecte de la nuit"
            echo "rien=oui" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ligne=$(python -m veille reste_rattrapage)
          echo "$ligne"
          if [ "$ligne" = "reste=0" ]; then echo "rien=oui" >> "$GITHUB_OUTPUT"; else echo "rien=non" >> "$GITHUB_OUTPUT"; fi

      # Changement de code (push) : tests de la collecte et du site dans un vrai navigateur.
      # S'ils échouent, rien n'est publié et une alerte part. Pas lancés pour la veille du matin,
      # où le code ne change pas : un composant de moins qui pourrait la bloquer.
      - name: Tests (changement de code seulement)
        if: (github.event_name == 'push') && (steps.garde.outputs.fait != 'oui' && steps.reste.outputs.rien != 'oui')
        run: |
          pip install "playwright>=1.49,<2"
          python -m playwright install --with-deps chromium
          python -m unittest discover tests

      # MP3 des fiches (veille/audio.py) : jamais dans le dépôt, gardés d'un jour à l'autre par le
      # cache de GitHub (une clé par run ; on reprend la plus récente), publiés avec le site.
      - name: MP3 des jours précédents
        if: steps.garde.outputs.fait != 'oui' && steps.reste.outputs.rien != 'oui'
        uses: actions/cache/restore@v6
        with:
          path: audio
          key: audio-${{ github.run_id }}
          restore-keys: audio-

      - name: Collecte, fiches IA et site
        if: steps.garde.outputs.fait != 'oui' && steps.reste.outputs.rien != 'oui'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}          # alertes de santé (source en panne, IA muette…)
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SYNC_GIST_ID: ${{ secrets.SYNC_GIST_ID }}      # favoris de l'appli : jamais effacés de la base
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}          # facultatif : copie de secours des favoris (gist secret)
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m veille site          # simple changement de config/apparence : pas de collecte
          elif [ "${{ inputs.rattrapage }}" = "true" ] || [ "${{ github.event.schedule }}" = "17 19 * * *" ]; then
            python -m veille resumer --rattrapage   # durée limitée : ia.rattrapage dans config.yaml
            python -m veille site
          else
            python -m veille tout          # collecte, fiches IA, choix des articles du jour, puis site
          fi

      # les notifications ont pu pousser entre-temps : 3 essais ; en cas de conflit, la base
      # de la collecte l'emporte (les notifications ne gardent que ce qui a été envoyé)
      - name: Sauvegarder la base d'articles
        if: steps.garde.outputs.fait != 'oui' && steps.reste.outputs.rien != 'oui'
        run: bash .github/pousser-data.sh "Veille du $(date -u +%Y-%m-%d)"

      # MP3 des fiches et audio du jour, APRÈS la collecte et la sauvegarde de la base : une panne ou
      # une lenteur du service de voix (ou de l'IA qui écrit le texte) ne peut ni annuler la collecte
      # ni empêcher la publication. Au pire, le site part avec les MP3 de la veille.
      - name: Audio (MP3 des fiches, audio du jour)
        if: github.event_name != 'push' && steps.garde.outputs.fait != 'oui' && steps.reste.outputs.rien != 'oui'
        timeout-minutes: 15
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SYNC_GIST_ID: ${{ secrets.SYNC_GIST_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.rattrapage }}" = "true" ] || [ "${{ github.event.schedule }}" = "17 19 * * *" ]; then
            python -m veille audio           # le soir : MP3 des nouvelles fiches (l'audio du jour est fait la nuit)
          else
            python -m veille audio --jour
          fi

      - name: Site avec l'audio
        if: github.event_name != 'push' && steps.garde.outputs.fait != 'oui' && steps.reste.outputs.rien != 'oui'
        run: python -m veille site           # quelques secondes : reprend les MP3 présents dans audio/

      - name: Garder les MP3 pour demain
        # même si l'étape audio a échoué ou dépassé son temps : ce qui est fait est gardé
        # (un simple push ne crée pas de MP3 : rien de neuf à garder)
        if: always() && github.event_name != 'push' && steps.garde.outputs.fait != 'oui' && steps.reste.outputs.rien != 'oui' && hashFiles('audio/audio.json') != ''
        continue-on-error: true     # cache indisponible : les MP3 seront refaits demain, sans plus
        uses: actions/cache/save@v6
        with:
          path: audio
          key: audio-${{ github.run_id }}

      - if: steps.garde.outputs.fait != 'oui' && steps.reste.outputs.rien != 'oui'
        uses: actions/configure-pages@v6
      - if: steps.garde.outputs.fait != 'oui' && steps.reste.outputs.rien != 'oui'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploiement
        if: steps.garde.outputs.fait != 'oui' && steps.reste.outputs.rien != 'oui'
        uses: actions/deploy-pages@v5
        continue-on-error: true     # GitHub ne voit parfois pas encore l'artefact : on retente
      - if: (steps.deploiement.outcome == 'failure') && (steps.garde.outputs.fait != 'oui' && steps.reste.outputs.rien != 'oui')
        run: sleep 30
      - if: (steps.deploiement.outcome == 'failure') && (steps.garde.outputs.fait != 'oui' && steps.reste.outputs.rien != 'oui')
        uses: actions/deploy-pages@v5

      - name: Prévenir en cas d'échec
        if: failure() && steps.garde.outputs.fait != 'oui' && steps.reste.outputs.rien != 'oui'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$NTFY_TOPIC" ] && exit 0
          curl -sS -X POST https://ntfy.sh -H "Content-Type: application/json" -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"⚠️ SciFeed : la veille quotidienne a échoué\",\"message\":\"La page n'a peut-être pas été mise à jour. Touchez pour voir le détail sur GitHub.\",\"priority\":4,\"tags\":[\"warning\"],\"click\":\"$LIEN\"}"
