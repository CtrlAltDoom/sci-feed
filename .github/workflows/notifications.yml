name: Notifications du matin

on:
  schedule:
    # Le matin, toutes les 20 min de 4 h à 7 h 40 UTC : à Paris 5 h → 8 h 40 en hiver,
    # 6 h → 9 h 40 en été. Le script n'envoie qu'une fois par jour, entre heure_min (6 h) et
    # heure_max (config.yaml) : avant 6 h à Paris, un créneau ne fait rien.
    - cron: "*/20 4-7 * * *"
    # filet de secours toutes les heures si GitHub a pris des heures de retard (après midi à
    # Paris, on envoie même sans la collecte du jour). Rien n'est envoyé deux fois :
    # dernier_envoi dans data/notifications.json.
    - cron: "47 8-19 * * *"
  # enchaînement automatique dès que la collecte du jour est terminée (collecte de la nuit
  # finie avant 6 h à Paris : rien n'est envoyé, le premier créneau après 6 h s'en charge)
  workflow_run:
    workflows: ["Veille quotidienne"]
    types: [completed]
  workflow_dispatch:
    inputs:
      forcer:
        description: "Envoyer maintenant, même hors de la plage horaire (test)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read           # voir si une veille tourne encore

# Sa propre file : GitHub ne garde qu'un run en attente par file, une notification ne doit donc
# jamais prendre la place d'une collecte en attente. Pas besoin d'attendre la collecte ici :
# le script s'arrête si elle n'est pas faite, et ce workflow est relancé dès qu'elle se termine.
concurrency:
  group: notifications
  cancel-in-progress: false

jobs:
  notifier:
    # après la veille : seulement une vraie collecte réussie (pas un simple changement de code,
    # ni le rattrapage automatique des fiches IA du soir, reconnu à son nom)
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event != 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.display_title != 'Rattrapage automatique des fiches IA')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # dernière version de main au démarrage (après la collecte), pas celle du moment du clic
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Créneau planifié pendant qu'une veille tourne : on la laisse finir, ce workflow est
      # relancé automatiquement à sa fin (workflow_run) avec les articles du jour.
      - name: Veille en cours ?
        id: attente
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w veille.yml -L 10 --json status,event \
              --jq '[.[] | select(.status != "completed" and .event != "push")] | length' || echo 0)
          if [ "${n:-0}" -gt 0 ]; then echo "en_cours=oui" >> "$GITHUB_OUTPUT"; echo "Veille en cours : on attend sa fin"; fi

      # Après une veille sans collecte (rattrapage des fiches IA) : rien à annoncer, on attend la
      # vraie collecte du jour, sinon la notification unique du jour partirait sans ses articles.
      - name: Collecte du jour faite ?
        id: collecte
        if: github.event_name == 'workflow_run'
        run: python -m veille deja_collecte >> "$GITHUB_OUTPUT"

      - name: Envoyer les notifications
        id: envoi
        if: steps.attente.outputs.en_cours != 'oui' && steps.collecte.outputs.fait != 'non'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SYNC_GIST_ID: ${{ secrets.SYNC_GIST_ID }}     # facultatif : ne pas notifier ce qui est déjà lu
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.forcer }}" = "true" ]; then
            python -m veille notifier --forcer
          else
            python -m veille notifier
          fi

      # la collecte peut pousser en même temps : 3 essais ; en cas de conflit, on garde sa base
      # et on n'impose que la liste des articles envoyés (jamais deux fois la même notification)
      - name: Retenir ce qui a été envoyé
        if: steps.envoi.outcome == 'success'
        run: bash .github/pousser-data.sh "Notifications du $(date -u +%Y-%m-%d)" data/notifications.json

      - name: Prévenir en cas d'échec
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$NTFY_TOPIC" ] && exit 0
          curl -sS -X POST https://ntfy.sh -H "Content-Type: application/json" -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"⚠️ SciFeed : les notifications du matin ont échoué\",\"message\":\"Touchez pour voir le détail sur GitHub.\",\"priority\":4,\"tags\":[\"warning\"],\"click\":\"$LIEN\"}"
