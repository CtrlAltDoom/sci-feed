name: Notifications du matin

on:
  schedule:
    # Deux créneaux pour couvrir l'heure d'hiver (5 h 40 UTC = 6 h 40 à Paris) et d'été
    # (4 h 40 UTC = 6 h 40 à Paris). Le script n'envoie qu'une fois par jour, entre
    # heure_min et heure_max (config.yaml) ; l'autre créneau ne fait rien.
    - cron: "40 4 * * *"
    - cron: "40 5 * * *"
    # filets de secours si GitHub a pris des heures de retard (rien n'est envoyé deux fois)
    - cron: "40 10 * * *"
    - cron: "40 16 * * *"
  # enchaînement automatique dès que la collecte du jour est terminée
  workflow_run:
    workflows: ["Veille quotidienne"]
    types: [completed]
  workflow_dispatch:
    inputs:
      forcer:
        description: "Envoyer maintenant, même hors de la plage horaire (test)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: veille            # attend la fin de la collecte du matin si elle tourne encore
  cancel-in-progress: false

jobs:
  notifier:
    # après la veille : seulement une vraie collecte réussie (pas un simple changement de code)
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event != 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # dernière version de main au démarrage (après la collecte), pas celle du moment du clic
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Envoyer les notifications
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SYNC_GIST_ID: ${{ secrets.SYNC_GIST_ID }}     # facultatif : ne pas notifier ce qui est déjà lu
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.forcer }}" = "true" ]; then
            python -m veille notifier --forcer
          else
            python -m veille notifier
          fi

      - name: Retenir ce qui a été envoyé
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Notifications du $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push

      - name: Prévenir en cas d'échec
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$NTFY_TOPIC" ] && exit 0
          curl -sS -X POST https://ntfy.sh -H "Content-Type: application/json" -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"⚠️ SciFeed : les notifications du matin ont échoué\",\"message\":\"Touchez pour voir le détail sur GitHub.\",\"priority\":4,\"tags\":[\"warning\"],\"click\":\"$LIEN\"}"
