<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f5b">
<title>Veille scientifique</title>
<link rel="alternate" type="application/rss+xml" title="Flux RSS" href="feed.xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="entete">
  <div class="barre">
    <div>
      <h1 id="titre">Veille scientifique</h1>
      <p class="maj" id="maj"></p>
    </div>
    <button class="icone" id="btn-filtres" aria-expanded="false" aria-controls="filtres" title="Filtres">Filtres</button>
  </div>
  <input type="search" id="recherche" placeholder="Rechercher (titre, résumé, revue, auteur…)" autocomplete="off">
  <nav class="themes" id="themes" aria-label="Thèmes"></nav>
  <section class="filtres" id="filtres" hidden>
    <label>Afficher
      <select id="f-vue">
        <option value="tous">Tout</option>
        <option value="nonlus">Non lus</option>
        <option value="favoris">Favoris</option>
        <option value="masques">Masqués</option>
      </select>
    </label>
    <label>Type
      <select id="f-type">
        <option value="">Tous les types</option>
        <option value="synthese">Méta-analyses & revues systématiques</option>
        <option value="ecr">Essais randomisés</option>
        <option value="publies">Publiés (hors preprints)</option>
        <option value="preprint">Preprints</option>
        <option value="registre">Essais enregistrés (à venir)</option>
      </select>
    </label>
    <label>Preuve min.
      <select id="f-niveau">
        <option value="0">Tous</option><option value="2">≥ 2</option><option value="3">≥ 3</option>
        <option value="4">≥ 4</option><option value="5">5</option>
      </select>
    </label>
    <label>Trier par
      <select id="f-tri">
        <option value="recent">Plus récents</option>
        <option value="pertinence">Pertinence pour moi</option>
        <option value="preuve">Niveau de preuve</option>
      </select>
    </label>
  </section>
</header>

<main>
  <div class="resume-liste">
    <span id="compteur"></span>
    <button class="lien" id="tout-lu">Tout marquer comme lu</button>
  </div>
  <div id="liste" aria-live="polite"></div>
  <button class="plus" id="plus" hidden>Afficher plus</button>
</main>

<footer class="pied">
  <p><a href="feed.xml">Flux RSS</a> · <button class="lien" id="export">Exporter les favoris (Zotero .ris)</button></p>
  <p class="note">Fiches générées par IA à partir des abstracts : à vérifier avant tout usage clinique. Vos lus/favoris restent dans ce navigateur.</p>
</footer>
<!--DONNEES-->
<script src="app.js"></script>
</body>
</html>
