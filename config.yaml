# ============================================================
#  Veille scientifique — fichier de configuration principal
#  C'est le SEUL fichier à modifier pour adapter l'outil.
# ============================================================

titre: "SciFeed"
contact_email: ""   # demandé par PubMed / OpenAlex ; laissé vide ici, fourni par le secret CONTACT_EMAIL

collecte:
  jours_initiaux: 21        # 1er lancement : combien de jours en arrière
  jours_glissants: 4        # lancements suivants : fenêtre qui se chevauche (les doublons sont fusionnés)
  conserver_jours: 180      # au-delà, les articles sont supprimés de la base, sauf vos favoris (si la synchronisation SYNC_GIST_ID est en place)
  max_par_requete: 150      # sécurité : nombre max de résultats par thème et par source
  exclure:                  # articles écartés si ces mots apparaissent dans le titre (laisser vide = rien d'exclu)
    - "in vitro"            # les études animales sont gardées et signalées par l'étiquette rouge « Étude animale »

# ------------------------------------------------------------
#  THÈMES
#  Chaque thème = une liste de "groupes". Un article est retenu s'il
#  contient AU MOINS UN terme de CHAQUE groupe (dans le titre ou l'abstract).
#    groupes: [[A, B], [C, D]]  =>  (A OU B) ET (C OU D)
#  designs_forts_seulement: true => ne garde que essais randomisés,
#  méta-analyses et revues systématiques (utile pour les sujets très larges).
#  Termes en anglais : c'est la langue de quasiment toutes les publications.
# ------------------------------------------------------------
themes:
  - id: sii
    nom: "SII & troubles digestifs fonctionnels"
    court: "SII"
    famille: sujet
    groupes:
      - ["irritable bowel syndrome", "irritable bowel", "IBS", "functional dyspepsia",
         "functional gastrointestinal disorder", "functional gastrointestinal disorders",
         "disorders of gut-brain interaction", "disorder of gut-brain interaction", "DGBI",
         "functional abdominal pain", "functional bloating", "functional constipation",
         "centrally mediated abdominal pain"]

  - id: psychogastro
    nom: "Axe intestin-cerveau & psychogastroentérologie"
    court: "Axe intestin-cerveau"
    famille: mecanisme
    groupes:
      - ["gut-brain axis", "brain-gut axis", "microbiota-gut-brain", "psychogastroenterology",
         "visceral hypersensitivity", "visceral sensitivity", "visceral anxiety",
         "gut-directed hypnotherapy", "gut-directed hypnosis", "brain-gut behavior therapy",
         "brain-gut behavioral therapy"]

  - id: psy_digestif
    nom: "Psychologie & maladies digestives"
    court: "Psy & digestif"
    famille: sujet
    groupes:
      - ["anxiety", "depression", "depressive", "psychological distress", "catastrophizing",
         "catastrophising", "hypervigilance", "avoidance", "cognitive behavioral therapy",
         "cognitive behavioural therapy", "hypnotherapy", "hypnosis", "psychotherapy",
         "mindfulness", "acceptance and commitment therapy", "self-compassion", "quality of life"]
      - ["gastrointestinal", "digestive", "bowel", "gut", "abdominal pain", "dyspepsia",
         "inflammatory bowel disease", "Crohn", "ulcerative colitis", "celiac", "coeliac",
         "gastroparesis", "fecal incontinence", "faecal incontinence"]

  - id: alexithymie
    nom: "Alexithymie & intéroception"
    court: "Alexithymie"
    famille: sujet
    groupes:
      - ["alexithymia", "alexithymic", "interoception", "interoceptive"]

  - id: hypnose
    nom: "Hypnose clinique"
    court: "Hypnose"
    famille: approche
    groupes:
      - ["hypnosis", "hypnotherapy", "hypnotic suggestion", "hypnotizability", "hypnotisability"]

  - id: psychotherapies
    nom: "Psychothérapies de l'anxiété et de la dépression"
    court: "Psychothérapies"
    famille: approche
    designs_forts_seulement: true
    groupes:
      - ["anxiety", "depression", "depressive", "panic", "health anxiety",
         "somatic symptom disorder", "somatic symptoms"]
      - ["cognitive behavioral", "cognitive behavioural", "CBT", "acceptance and commitment",
         "mindfulness", "self-compassion", "compassion-focused", "hypnosis", "psychotherapy",
         "psychological intervention", "exposure therapy"]

  - id: arfid_toc
    nom: "ARFID & TOC"
    court: "ARFID & TOC"
    famille: sujet
    groupes:
      - ["ARFID", "avoidant restrictive food intake", "avoidant/restrictive food intake",
         "obsessive-compulsive disorder", "OCD"]

# ------------------------------------------------------------
#  ÉTIQUETTES (filtres de tri)
#  Contrairement aux thèmes, elles ne lancent AUCUNE recherche : elles servent
#  seulement à trier les articles déjà collectés (gratuit, sans quota).
#  Même syntaxe que les thèmes, plus :
#    "mot*"               => troncature (alexithymi* = alexithymia, alexithymic…)
#    titre_seulement: true => cherche seulement dans le titre (pour les termes
#                            présents dans presque tous les abstracts)
#  famille = couleur : sujet (bleu), approche (vert), mecanisme (violet), animal (rouge)
#  Source des termes : dictionnaire de requêtes « Veille SII & psychologie ».
# ------------------------------------------------------------
familles:
  sujet: "Sujets psy"
  approche: "Approches"
  mecanisme: "Corps & mécanismes"
  animal: "Signalement"

etiquettes:
  - id: animal
    nom: "Étude animale"
    court: "Animal"
    famille: animal
    # dans le titre : toujours signalé
    titre:
      - ["rat", "rats", "mice", "mouse", "murine", "rodent*", "animal model*", "animal study",
         "preclinical", "zebrafish", "canine", "dogs", "piglet*", "primate*"]
    # dans l'abstract seulement : signalé, sauf pour les revues (qui citent souvent des travaux animaux)
    groupes:
      - ["rats", "mice", "murine", "rodent*", "zebrafish", "piglet*", "water avoidance stress",
         "restraint stress", "maternal separation", "knockout mice", "wild-type mice"]
    sauf: ["review", "meta-analysis", "meta-analyses", "umbrella review", "scoping review"]

  - id: anx_dep
    nom: "Anxiété & dépression"
    court: "Anxiété · dépression"
    famille: sujet
    titre_seulement: true     # présents dans presque tous les abstracts SII : on ne regarde que le titre
    groupes:
      - ["anxi*", "depress*", "panic", "agoraphobi*", "anhedonia", "dysthymi*", "psychological distress"]

  - id: emotions
    nom: "Alexithymie & émotions"
    court: "Émotions"
    famille: sujet
    groupes:
      - ["alexithymi*", "emotional awareness", "emotional clarity", "difficulty identifying feelings",
         "externally oriented thinking", "emotion regulation", "emotional regulation",
         "emotion dysregulation", "emotional dysregulation", "emotional suppression",
         "expressive suppression", "cognitive reappraisal", "mentaliz*", "mentalis*"]

  - id: processus
    nom: "Catastrophisation, hypervigilance & évitement"
    court: "Hypervigilance & évitement"
    famille: sujet
    groupes:
      - ["catastrophi*", "hypervigilan*", "symptom monitoring", "symptom checking", "somatic vigilance",
         "visceral sensitivity", "visceral anxiety", "GI-specific anxiety", "gastrointestinal-specific anxiety",
         "gut-specific anxiety", "symptom-specific anxiety", "anxiety sensitivity", "fear of symptoms",
         "attentional bias*", "attention bias*", "interpretation bias*", "interpretive bias*", "cognitive bias*",
         "fear-avoidance", "avoidance behavio*", "experiential avoidance", "safety behavio*",
         "food avoidance", "activity avoidance", "kinesiophobia", "rumination", "ruminative",
         "repetitive negative thinking", "intolerance of uncertainty", "illness perception*",
         "illness representation*", "illness belief*", "health anxiety", "illness anxiety",
         "psychological flexibility"]

  - id: trauma
    nom: "Trauma & adversité précoce"
    court: "Trauma"
    famille: sujet
    groupes:
      - ["PTSD", "posttraumatic", "post-traumatic", "adverse childhood experience*", "childhood trauma",
         "early life adversity", "early-life adversity", "early adverse", "maltreatment", "childhood abuse",
         "sexual abuse", "psychological trauma"]

  - id: alimentation
    nom: "Alimentation & TCA"
    court: "Alimentation & TCA"
    famille: sujet
    groupes:
      - ["ARFID", "avoidant restrictive food intake", "avoidant/restrictive food intake", "eating disorder*",
         "disordered eating", "anorexia nervosa", "bulimi*", "binge eating", "orthorexi*",
         "food restriction", "restrictive eating", "food-related quality of life"]

  - id: stigma
    nom: "Stigmatisation, honte & secret"
    court: "Stigma & secret"
    famille: sujet
    groupes:
      - ["stigma*", "shame", "secrecy", "concealment", "self-disclosure", "illness disclosure",
         "embarrassment", "fear of incontinence", "toilet anxiety", "toilet access", "bathroom access",
         "illegitimacy", "epistemic injustice", "invalidation"]

  - id: cognition
    nom: "Cognition & brain fog"
    court: "Brain fog"
    famille: sujet
    groupes:
      - ["cognitive impairment", "cognitive dysfunction", "cognitive function*", "cognitive performance",
         "brain fog", "executive function*", "working memory", "neuropsycholog*", "processing speed",
         "sustained attention", "cognitive complaints", "subjective cognitive"]

  - id: corps
    nom: "Intéroception, corps & douleur"
    court: "Intéroception & douleur"
    famille: mecanisme
    groupes:
      - ["interocepti*", "body awareness", "bodily awareness", "body vigilance", "body image",
         "visceral hypersensitivity", "visceral pain", "central sensiti*", "pain sensitivity",
         "pain processing", "descending pain"]

  - id: tcc
    nom: "TCC & thérapies cerveau-intestin"
    court: "TCC"
    famille: approche
    groupes:
      - ["cognitive behavioral therap*", "cognitive behavioural therap*", "cognitive-behavioral",
         "cognitive-behavioural", "CBT", "brain-gut behavio*", "interoceptive exposure",
         "exposure therapy", "exposure-based"]

  - id: troisieme_vague
    nom: "Pleine conscience, ACT & autocompassion"
    court: "Mindfulness · ACT · compassion"
    famille: approche
    groupes:
      - ["mindfulness", "mindfulness-based", "acceptance and commitment", "self-compassion",
         "compassion-focused", "compassion focused", "third-wave", "dialectical behavio*"]

# ------------------------------------------------------------
#  INTÉRÊT : ce qui compte le plus pour vous
#  Sert à classer la liste (tri « Pour moi ») et à choisir quels articles
#  reçoivent une fiche IA en premier.
#    score = points des thèmes + points par étiquette (+ pertinence de la fiche IA)
#    puis -1 point tous les `jours_par_point` jours d'ancienneté.
#  Ex. avec 2 : un article d'aujourd'hui à 4 points passe devant un article
#  d'il y a 6 jours à 6 points.
# ------------------------------------------------------------
interet:
  themes:                  # points par thème (les thèmes absents valent 0)
    sii: 2
    hypnose: 2
    alexithymie: 2
    psychogastro: 2
    psy_digestif: 1
  etiquette: 1             # points par étiquette (hors « Étude animale »)
  etiquettes_max: 3        # plafond (évite qu'un texte bavard qui coche tout passe devant)
  animal: -3               # études animales
  serieux:                 # sérieux de la source (notoriété de la revue, d'après OpenAlex)
    revue_reference: 1
    revue_etablie: 0.5
    revue_peu_citee: 0
    inconnue: -0.5         # pas de revue identifiée (page web, livre, archive…)
    preprint: -1           # non relu par des pairs
  jours_par_point: 2       # vitesse à laquelle l'ancienneté fait reculer un article

# ------------------------------------------------------------
#  SITE : fichiers allégés pour une ouverture rapide sur téléphone
#  À l'ouverture, l'appli ne télécharge que les articles récents, sans leurs abstracts.
#  Les articles plus anciens arrivent juste après ; un abstract se charge en ouvrant « Détails »
#  (ou pour une recherche). Rien ne change à l'affichage.
# ------------------------------------------------------------
site:
  jours_recents: 30        # articles ajoutés depuis N jours : chargés tout de suite
  details_par_fichier: 100 # abstracts regroupés par paquets de N (par jour d'ajout)

# ------------------------------------------------------------
#  NOTIFICATIONS DU MATIN (appli gratuite ntfy, Android / iOS)
#  Le nom du canal n'est PAS ici (dépôt public) : il est dans le secret GitHub NTFY_TOPIC.
#  Dans l'appli ntfy : « + » puis ce nom de canal.
#  Envoi par .github/workflows/notifications.yml, entre heure_min et heure_max (heure de Paris,
#  été comme hiver ; GitHub part souvent en retard, parfois de plusieurs heures). Les notifications
#  partent aussi automatiquement à la fin de la collecte du jour.
# ------------------------------------------------------------
notifications:
  actif: true
  nombre: 5                # articles par matin
  format: par_article      # par_article (une notification chacun) ou resume (une seule, avec la liste)
  fenetre_jours: 2         # articles ajoutés depuis N jours (jamais deux fois le même)
  heure_min: "06:30"
  heure_max: "21:00"       # les tâches GitHub partent parfois avec des heures de retard : on accepte d'envoyer tard plutôt que rien
  attendre_collecte_jusqua: "12:00"  # avant cette heure, on attend que la collecte du jour soit faite ; après, on envoie avec ce qu'on a
  fuseau: "Europe/Paris"
  exclure: ["animal"]      # thèmes ou étiquettes jamais notifiés
  inclure: []              # si rempli : seulement ces thèmes / étiquettes
  revue_min: 0             # 0 = toutes ; 2 = revues établies ; 3 = de référence
  preuve_min: 0            # niveau de preuve minimal de la fiche IA (0 = tous)
  priorite: 4              # 1 à 5 ; 4 = haute (bandeau sur Android), 3 = normale
  ignorer_deja_vus: true   # ne pas notifier ce qui est déjà lu, favori ou masqué dans l'appli
                           # (nécessite le secret SYNC_GIST_ID : identifiant du gist de synchronisation)
  serveur: "https://ntfy.sh"
  hebdo:                   # résumé de la semaine : une seule notification, les articles marquants des 7 derniers jours
    actif: true
    jour: 6                # 0 = lundi … 6 = dimanche
    nombre: 10
    priorite: 3            # normale : pas de bandeau

# ------------------------------------------------------------
#  ALERTES DE SANTÉ (même canal ntfy que les notifications)
#  « ⚠️ SciFeed » si une panne dure, « ✅ » quand c'est réparé. Au plus une alerte par jour.
# ------------------------------------------------------------
sante:
  actif: true
  source_jours: 2          # une source en échec N passages de suite
  ia_jours: 2              # aucune fiche IA N passages de suite alors que des articles attendent
  collecte_vide_jours: 3   # aucun nouvel article N passages de suite
  retard_heures: 36        # la collecte quotidienne n'a pas tourné depuis N heures
  rappel_jours: 7          # rappel si le problème persiste
  depot_max_mo: 500        # prévenir si le dépôt GitHub dépasse cette taille (0 = ne pas surveiller)

# ------------------------------------------------------------
#  FAVORIS RÉTRACTÉS : chaque jour, vos favoris sont revérifiés (OpenAlex / Retraction Watch).
#  Un favori nouvellement rétracté est marqué sur le site et signalé sur ntfy.
#  Nécessite la synchronisation de l'appli (secret SYNC_GIST_ID).
# ------------------------------------------------------------
retractions:
  actif: true

# ------------------------------------------------------------
#  TEXTES INTÉGRAUX GRATUITS ET LÉGAUX (Unpaywall)
#  Complète le lien « Texte libre » quand OpenAlex / PubMed n'en donnent pas.
#  Nécessite l'e-mail de contact (secret CONTACT_EMAIL).
# ------------------------------------------------------------
texte_libre:
  actif: true
  max_par_passage: 200     # articles vérifiés par jour
  revoir_jours: 30         # revérifier un article sans version libre tous les N jours…
  age_max_jours: 365       # …tant qu'il a moins d'un an

# ------------------------------------------------------------
#  SOURCES (toutes gratuites, sans inscription obligatoire)
# ------------------------------------------------------------
sources:
  pubmed:
    actif: true             # MEDLINE + PubMed (référence en biomédical)
  europepmc:
    actif: true             # PubMed + PMC + preprints (medRxiv, bioRxiv, PsyArXiv, Research Square…)
    preprints: true
  openalex:
    actif: true             # index ouvert, toutes disciplines (bon pour la psychologie hors PubMed)
  clinicaltrials:
    actif: true             # nouveaux essais enregistrés (ClinicalTrials.gov)
  rss:
    actif: true
    # Flux de revues : chaque article est filtré avec vos thèmes.
    # Pour ajouter une revue : copier une ligne, changer nom + url. Un flux en panne est simplement ignoré.
    flux:
      - nom: "Neurogastroenterology & Motility"
        url: "https://onlinelibrary.wiley.com/feed/13652982/most-recent"
      - nom: "Alimentary Pharmacology & Therapeutics"
        url: "https://onlinelibrary.wiley.com/feed/13652036/most-recent"
      - nom: "Gastroenterology"
        url: "https://rss.sciencedirect.com/publication/science/00165085"
      - nom: "Journal of Psychosomatic Research"
        url: "https://rss.sciencedirect.com/publication/science/00223999"
      - nom: "Int. Journal of Clinical and Experimental Hypnosis"
        url: "https://www.tandfonline.com/feed/rss/nhyp20"
      - nom: "medRxiv — Gastroentérologie"
        url: "https://connect.medrxiv.org/medrxiv_xml.php?subject=Gastroenterology"
      - nom: "medRxiv — Psychiatrie & psychologie clinique"
        url: "https://connect.medrxiv.org/medrxiv_xml.php?subject=Psychiatry_and_Clinical_Psychology"
    # Flux NON filtrés (blogs, actualités…) : tout est gardé. Exemple :
    # flux_libres:
    #   - nom: "Blog Monash FODMAP"
    #     url: "https://www.monashfodmap.com/blog/rss/"
    #     theme: "sii"
    flux_libres: []

# ------------------------------------------------------------
#  IA : fiches de lecture automatiques
#  Fonctionne avec n'importe quel service "compatible OpenAI" :
#  OpenRouter (défaut), Google Gemini, Groq, Mistral, Ollama local…
#  La clé n'est JAMAIS écrite ici : elle est dans un "secret" GitHub (LLM_API_KEY).
# ------------------------------------------------------------
ia:
  actif: true
  base_url: "https://openrouter.ai/api/v1"
  # Essayés dans l'ordre : si le premier est saturé, on passe au suivant.
  # "openrouter/free" = routeur qui choisit automatiquement un modèle gratuit disponible.
  modeles:
    - "openrouter/free"
  secours_auto: true             # si les modèles ci-dessus échouent : essayer d'autres modèles gratuits du moment
  secours_max: 3
  # Chaîne de fournisseurs gratuits, essayés dans l'ordre : quand l'un est épuisé (quota, panne,
  # clé refusée) ou a utilisé sa part ci-dessous, le suivant prend le relais.
  # Un fournisseur dont le secret est absent est simplement ignoré.
  fournisseurs:
    - nom: "OpenRouter"
      base_url: "https://openrouter.ai/api/v1"
      cle_env: "LLM_API_KEY"
      modeles: ["openrouter/free"]
      max_requetes: 40           # gratuit : 50 requêtes/jour
      duree_max_minutes: 12      # modèles lents (20 s à 4 min par lot) : on laisse vite la place
    - nom: "Google AI Studio"
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
      cle_env: "GEMINI_API_KEY"
      # Quotas gratuits, propres à chaque modèle (AI Studio > Limite de débit, nov. 2026) :
      # Hydrogen, 3.8 Flash, 3.6 Flash : 20 requêtes/jour chacun, 5/minute ;
      # 3.5 et 3.1 Flash Lite : 500 requêtes/jour chacun, 15/minute (le gros du travail).
      modeles: ["gemini-4-hydrogen", "gemini-3.8-flash", "gemini-3.6-flash",
                "gemini-3.5-flash-lite", "gemini-3.1-flash-lite"]
      requetes_par_minute: 5     # le plus strict des modèles ci-dessus : jamais de 429 « par minute »
      reasoning_effort: "low"
    - nom: "Mistral"
      base_url: "https://api.mistral.ai/v1"
      cle_env: "MISTRAL_API_KEY"
      modeles: ["mistral-small-latest", "mistral-medium-latest"]
  articles_par_requete: 5        # plusieurs abstracts par appel => économise le quota gratuit
  max_requetes_par_execution: 150 # tous fournisseurs confondus
  pause_secondes: 4              # limites gratuites : 20 requêtes/minute (OpenRouter), 1/seconde (Mistral)
  duree_max_minutes: 30          # on s'arrête à temps (le workflow est coupé à 45 min)
  json_strict: true              # demande une réponse en JSON strict (repli automatique si refusé)
  # Rattrapage des fiches (chaque soir vers 20 h 17 si auto, ou à la main : Actions > Veille
  # quotidienne > rattrapage) : fiches seulement, sans collecte.
  # Durée limitée pour ne pas bloquer la file de la collecte ; ce qui est fait est enregistré.
  rattrapage:
    auto: true                   # rattrapage automatique chaque soir tant qu'il reste des articles sans fiche ; mettre false pour l'arrêter
    duree_max_minutes: 40
    max_requetes: 600
  effort_raisonnement: "low"     # réflexion courte = réponses plus rapides (ignoré par les modèles qui ne réfléchissent pas)
  # Ordre de passage : articles des N derniers jours d'abord, puis par intérêt (section `interet`).
  priorite_jours_recents: 3
  temperature: 0.1
  profil_lecteur: >
    Psychologue clinicien et hypnothérapeute exerçant en psychogastroentérologie
    (syndrome de l'intestin irritable, troubles digestifs fonctionnels), à l'hôpital et en libéral.
    Approches TCC, hypnose digestive (y compris en groupe), autocompassion. Intérêt pour
    l'hypervigilance, la catastrophisation, l'évitement, l'alexithymie, l'intéroception,
    l'anxiété et la dépression, l'ARFID et les TOC.
